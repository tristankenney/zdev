# zdev tmux integration — source this from your ~/.tmux.conf:
#
#   source-file ~/workspace/zdev/config/zdev.tmux.conf
#
# Or copy the contents inline if you'd rather manage them yourself.

# --- baseline ergonomics ---
# Settings a personal tmux conf usually supplies, shipped here so a
# FRESH machine works out of the box (first Ubuntu install surfaced
# each gap one report at a time). Override any of these after your
# source-file line — later settings win.
#
# Mouse: click to focus panes (a zdev layout is 3 panes — sidebar,
# shell, agent — so pointer focus matters more than in plain tmux),
# drag borders to resize, wheel to scroll.
set -g mouse on
# Alt-chord + ESC latency: tmux's default 500ms escape-time makes the
# M-* bindings and ESC-heavy editors/agents feel broken.
set -g escape-time 0
# Claude Code binds modified Enter (Shift/Ctrl/Alt+Enter); without
# extended keys tmux swallows the modifier.
set -g extended-keys on
# Agents and editors that repaint on focus need focus events forwarded.
set -g focus-events on
# Color fidelity for the sidebar's 256-color palette and agent TUIs.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"

# --- pane titles drive the agent attention indicator ---
# Pane titles like "● claude" / "⠐ Claude Code" / "π - <project>" are how
# zdevd identifies which pane is which agent and what state it's in. Don't
# let shell prompts or tmux's automatic-rename overwrite them.
set -g pane-border-status top
set -g allow-rename off
setw -g automatic-rename off

# --- bell-driven status indicators ---
# Some agents ring the terminal bell when they need attention; surface that
# in the status line.
set -g monitor-bell on
set -g bell-action any
set -g visual-bell off
setw -g window-status-bell-style "fg=red,bold,reverse"

# --- conditional zdev project sidebar ---
# Auto-creates a left sidebar pane on every window when the client is wide
# enough; removes it when the window shrinks. Tune via env vars:
#   ZDEV_SIDEBAR_THRESHOLD (cols, default 160)
#   ZDEV_SIDEBAR_WIDTH     (cols, default 50)
#   ZDEV_SIDEBAR_HYSTERESIS
#   ZDEV_SIDEBAR_FOOTER    (full | compact | off — footer tally style)
# Scoped to #{window_id} so each toggle only touches the focal window.
set-hook -g client-attached         "run-shell -b '~/.local/bin/zdev-sidebar-toggle #{window_id}'"
set-hook -g client-resized          "run-shell -b '~/.local/bin/zdev-sidebar-toggle #{window_id}'"
set-hook -g client-session-changed  "run-shell -b '~/.local/bin/zdev-sidebar-toggle #{window_id}'"
set-hook -g session-created         "run-shell -b '~/.local/bin/zdev-sidebar-toggle #{window_id}'"
set-hook -g after-new-window        "run-shell -b '~/.local/bin/zdev-sidebar-toggle #{window_id}'"
set-hook -g after-select-window     "run-shell -b '~/.local/bin/zdev-sidebar-toggle #{window_id}'"

# Clear "just finished" markers when the user switches into a session
# (treats session-attendance as implicit acknowledgement).
set-hook -ag client-session-changed "run-shell -b '~/.local/bin/zdev-clear-on-visit'"
set-hook -ag client-attached        "run-shell -b '~/.local/bin/zdev-clear-on-visit'"

# Bounce human clients off zdevd-watcher (the daemon's internal anchor
# session — work there is invisible to zdev). A bare `tmux attach` can
# land in it when it's the only/most-recent session.
set-hook -ag client-attached        "run-shell -b '~/.local/bin/zdev-watcher-bounce'"
set-hook -ag client-session-changed "run-shell -b '~/.local/bin/zdev-watcher-bounce'"

# --- core bindings (enabled by default) ---
# These five are the supervisory loop; rebind by adding your own `bind`
# AFTER the source-file line in your ~/.tmux.conf (later binds win), or
# drop one with `unbind -n M-x`.
#
# M-p  project switcher: fzf over the configured project list — pick one
#      to start/jump to its session (requires fzf).
# M-n  zdev next: jump to the session that most needs you (⚡ permission
#      prompts first, then oldest question, then finished work; skips the
#      session you're already in).
# M-a  triage popup: the full ranked queue with the captured wait context
#      as a preview — answer most questions without entering the session
#      (requires fzf).
# M-r  zdev ack --all: acknowledge every current status — waiting,
#      finished, dead — like an inbox "read all". Clears the demand; new
#      agent activity re-raises attention normally.
# M-?  help: what zdev keys are bound (live from list-keys) + the glyph
#      legend. The list also surfaces M-/ (notify toggle) automatically
#      since it's parsed from `tmux list-keys`.
bind -n M-p run-shell "tmux display-popup -E -w 60% -h 60% '$HOME/.local/bin/zdev-pick'"
bind -n M-n run-shell "$HOME/.local/bin/zdev next"
bind -n M-a display-popup -E -w 80% -h 70% "$HOME/.local/bin/zdev-triage-popup"
bind -n M-r run-shell "$HOME/.local/bin/zdev ack --all"
bind -n 'M-?' display-popup -E -w 70% -h 80% "$HOME/.local/bin/zdev-help-popup"

# --- sidebar cursor navigation (zd-e6e) ---
# M-j/M-k move the sidebar row cursor down/up; M-Enter switches to the
# selected session. Uses -b (background) so the socket round-trip doesn't
# block tmux's input handler.
bind -n M-j run-shell -b "$HOME/.local/bin/zdev-sidebar-move +1"
bind -n M-k run-shell -b "$HOME/.local/bin/zdev-sidebar-move -1"
bind -n M-Enter run-shell -b "$HOME/.local/bin/zdev-sidebar-move select"

# --- runtime notification mute (zd-jbc) ---
# M-/ toggles tier notification banners: muted -> active, active -> mute
# 1h. The "/" key reads mnemonically as "silence". -b (background) keeps
# tmux's input handler free; the result is surfaced via display-message
# so the user sees confirmation without a popup.
bind -n M-/ run-shell -b "RESULT=$($HOME/.local/bin/zdev notify toggle 2>&1); tmux display-message \"$RESULT\""

# --- optional popup bindings (require fzf) ---
# Uncomment whichever you want. Defaults bind to Meta (Alt) chords; remap
# freely.
#
# (M-/ is now bound above to notify toggle; pick a different chord —
#  e.g. M-' — if you also want zdev-prompt-picker)
# bind -n "M-'" display-popup -E -w 80% -h 70% "$HOME/.local/bin/zdev-prompt-picker '#{pane_id}'"
# bind -n M-t display-popup -E -w 80% -h 70% "$HOME/.local/bin/zdev-timeline-popup"
# bind -n M-b display-popup -E -w 80% -h 50% "$HOME/.local/bin/zdev-broadcast-claude"
