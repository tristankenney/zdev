name: CI

on:
  push:
    branches: [main]
  pull_request:

# Run only one CI per branch; cancel queued/in-progress runs on a new push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: zdevd/go.mod
          cache-dependency-path: zdevd/go.sum

      - name: Install platform prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          set -e
          sudo apt-get update -qq
          # zsh because some scripts use #!/bin/zsh; systemd-analyze for unit
          # linting (`make test` runs it best-effort).
          sudo apt-get install -y --no-install-recommends \
            tmux zsh jq systemd

      - name: Shell-syntax checks
        run: |
          set -e
          # Pick the interpreter from each shebang so we don't false-fail
          # bash scripts under zsh (or vice-versa).
          check() {
            local f="$1"
            local shebang
            shebang=$(head -1 "$f")
            case "$shebang" in
              *zsh*)  zsh  -n "$f" ;;
              *bash*) bash -n "$f" ;;
              *)      sh   -n "$f" ;;
            esac
            echo "  ok: $f"
          }
          check install.sh
          for f in zdevd/scripts/*.sh; do check "$f"; done
          for f in bin/*; do check "$f"; done

      - name: make test (lint + anti-fork gates + go test -race)
        run: make -C zdevd test
