name: CI

on:
  push:
    branches: [main]
  pull_request:

# Run only one CI per branch; cancel queued/in-progress runs on a new push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: zdevd/go.mod
          cache-dependency-path: zdevd/go.sum

      - name: Install platform prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          set -e
          sudo apt-get update -qq
          # systemd-analyze for unit linting (`make test` runs it best-effort).
          sudo apt-get install -y --no-install-recommends \
            tmux jq systemd

      - name: Shell-syntax checks
        run: |
          set -e
          # Everything is bash (the zsh dependency was adoption bug #2).
          check() {
            local f="$1"
            local shebang
            shebang=$(head -1 "$f")
            case "$shebang" in
              *bash*) bash -n "$f" ;;
              *)      sh   -n "$f" ;;
            esac
            echo "  ok: $f"
          }
          check install.sh
          for f in zdevd/scripts/*.sh; do check "$f"; done
          for f in bin/*; do check "$f"; done

      - name: opencode plugin contract
        run: node scripts/test-opencode-plugin.mjs

      - name: codex notify adapter contract
        run: bash scripts/test-codex-notify.sh

      - name: make test (lint + anti-fork gates + go test -race)
        run: make -C zdevd test

  # Agent-simulation smoke (Linux): real tmux server, real daemon, and
  # synthetic agent lifecycles driven through the SAME entry points the
  # agents use — claude-style hook invocations (JSON on stdin) and the
  # opencode adapter's notify states — asserted end-to-end via the
  # triage queue. This is "run it in CI with different agents" minus
  # the model APIs: the agents' integration surfaces are exercised;
  # their LLM loops are not (that needs API keys — follow-up workflow).
  agent-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: zdevd/go.mod
          cache-dependency-path: zdevd/go.sum
      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tmux jq
      - name: install (non-interactive)
        run: |
          mkdir -p "$HOME/workspace/proj-a" "$HOME/.claude" "$HOME/.config/opencode"
          ./install.sh < /dev/null
          echo 'proj-a' > "$HOME/.config/zdev/projects"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # Hook + plugin installs must have landed.
          jq -e '.hooks.SessionEnd' "$HOME/.claude/settings.json" >/dev/null
          test -L "$HOME/.config/opencode/plugins/zdev-notify.js"
          test -L "$HOME/.config/opencode/plugin/zdev-notify.js"
      - name: boot daemon + fleet
        run: |
          # ONE daemon, ONE tmux server, in a deterministic order.
          # Runners DO have a systemd user bus, so make install genuinely
          # started the unit — left alive it races the nohup'd daemon
          # below (singleton handoff churned the tmux server and took the
          # proj-a session with it; first smoke runs failed exactly there).
          systemctl --user disable --now zdevd.service zdev-reaper.timer 2>/dev/null || true
          tmux kill-server 2>/dev/null || true
          sleep 1
          # GT socket bootstrap (zd-1pi.1): set GT_TOWN_ROOT so the dual-
          # supervisor activates and watches GT sessions on a sibling tmux
          # socket. The socket name is sha256(GT_TOWN_ROOT) first 6 hex.
          # ZDEV_SIDEBAR_UNMANAGED=show surfaces those sessions as
          # Unmanaged rows in the snapshot (default hides them).
          export GT_TOWN_ROOT="$HOME/gt-ci"
          mkdir -p "$GT_TOWN_ROOT"
          GT_SOCK="gt-$(printf '%s' "$GT_TOWN_ROOT" | sha256sum | cut -c1-6)"
          echo "GT_SOCK=$GT_SOCK" >> "$GITHUB_ENV"
          echo "GT_TOWN_ROOT=$GT_TOWN_ROOT" >> "$GITHUB_ENV"
          # Spin up a tmux session on the GT socket BEFORE the daemon boots
          # so its first poll already finds the session.
          tmux -L "$GT_SOCK" new-session -d -s gt-agent-1 2>/dev/null || true
          nohup env GT_TOWN_ROOT="$GT_TOWN_ROOT" ZDEV_SIDEBAR_UNMANAGED=show \
            "$HOME/.local/bin/zdevd" >/tmp/zdevd.log 2>&1 &
          for i in $(seq 1 30); do
            zdev-show triage >/dev/null 2>&1 && break
            sleep 1
          done
          # Fleet AFTER the daemon owns the tmux server.
          tmux new-session -d -s proj-a -c "$HOME/workspace/proj-a"
          sleep 2
          zdevd diag || true
          tmux ls
          tmux has-session -t =proj-a
      - name: GT socket bootstrap (zd-1pi.1)
        run: |
          # The dual-supervisor only activates when GT_TOWN_ROOT is set; the
          # boot step above passes it into the daemon env. Verify the second
          # supervisor sees the GT tmux session and surfaces it as a row.
          # ZDEV_SIDEBAR_UNMANAGED=show (set on the daemon) makes the row
          # appear in the snapshot — otherwise GT sessions are hidden from
          # `zdev-show list --json` for non-opt-in users.
          ok=0
          for i in $(seq 1 30); do
            if zdev-show list --json | python3 -c "
import sys, json
rows = json.load(sys.stdin)
gt_rows = [r for r in rows if 'gt-agent-1' in r.get('name','')]
sys.exit(0 if gt_rows else 1)
"; then
              ok=1; break
            fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then
            echo "FAIL: GT sessions not visible in snapshot"
            zdev-show list --json
            exit 1
          fi
          echo "ok: GT socket bootstrap — dual-supervisor sees GT sessions"
      - name: claude lifecycle (hook JSON → triage → clear → death → ack)
        run: |
          pane=$(tmux list-panes -s -t proj-a -F '#{pane_id}' | head -1)
          test -n "$pane" || { echo "FAIL: proj-a session vanished"; tmux ls; exit 1; }
          # Poll-with-timeout, NOT fixed sleeps: attention derives from
          # pane titles, which reach the daemon via its 5s cross-session
          # poll — a 3s sleep races it (first smoke run failed exactly
          # there).
          wait_in()  { for i in $(seq 1 40); do zdev-show triage | grep -q proj-a && return 0; sleep 1; done
                       echo "FAIL: $1"; zdev-show triage; return 1; }
          wait_out() { for i in $(seq 1 40); do zdev-show triage | grep -q proj-a || return 0; sleep 1; done
                       echo "FAIL: $1"; zdev-show triage; return 1; }
          # Agent asks a question → enters the triage queue.
          printf '%s' '{"message":"Which database should I use?"}' \
            | TMUX_PANE="$pane" zdev-notify claude waiting --json
          wait_in "waiting state never reached triage"
          # User answers (clear): the agent's wait ends, but nobody has
          # VISITED the session — the latch deliberately keeps the queue
          # entry so an unseen wait can't vanish silently. Headless CI
          # never attends, so assert the latch HOLDS, then release it
          # with ack (the synthetic visit) — this exercises the latch
          # contract and ack-as-visit in one pass.
          TMUX_PANE="$pane" zdev-notify claude clear
          sleep 2
          zdev-show triage | grep -q proj-a \
            || { echo "FAIL: latch dropped a cleared-but-unseen wait"; exit 1; }
          zdev ack proj-a
          wait_out "ack did not release the latched wait"
          # Unclean SessionEnd → death tops the queue; ack clears it.
          printf '%s' '{"reason":"other"}' \
            | TMUX_PANE="$pane" zdev-notify claude session-end --json
          wait_in "death never reached triage"
          zdev ack --all
          wait_out "ack did not clear the death"
      - name: cursor navigation (zd-e6e)
        run: |
          # `zdevd cursor +1` dials the daemon, mutates CursorRow in the
          # snapshot, and returns the project name at the resulting row.
          # CI just needs to know the command reaches the daemon, applies
          # without error, and the daemon stays healthy afterwards.
          zdevd cursor +1 >/dev/null \
            || { echo "FAIL: zdevd cursor +1 errored"; exit 1; }
          zdevd cursor -1 >/dev/null \
            || { echo "FAIL: zdevd cursor -1 errored"; exit 1; }
          zdevd diag >/dev/null \
            || { echo "FAIL: daemon unhealthy after cursor moves"; exit 1; }
          echo "ok: cursor navigation — +1/-1 round-trip + daemon healthy"
      - name: opencode lifecycle (adapter states → triage)
        run: |
          pane=$(tmux list-panes -s -t proj-a -F '#{pane_id}' | head -1)
          wait_in()  { for i in $(seq 1 40); do zdev-show triage | grep -q proj-a && return 0; sleep 1; done
                       echo "FAIL: $1"; zdev-show triage; return 1; }
          # The exact argv the plugin produces (its event→state mapping
          # is covered by scripts/test-opencode-plugin.mjs; this leg
          # covers the daemon side of the contract).
          TMUX_PANE="$pane" zdev-notify opencode done
          wait_in "opencode done state never reached triage"
          zdev ack --all
      - name: diagnostics on failure
        if: failure()
        run: |
          echo "=== zdevd diag ==="; zdevd diag || true
          echo "=== tmux state ==="; tmux ls || true; tmux list-panes -a -F '#{session_name} #{pane_id} [#{pane_title}]' || true
          echo "=== notif dir ==="; ls -la "${TMPDIR:-/tmp/}zdevd-notif/" 2>/dev/null; cat "${TMPDIR:-/tmp/}zdevd-notif/"* 2>/dev/null || true
          echo "=== daemon slog ==="; cat "$HOME/.local/state/zdev/zdevd.log" 2>/dev/null | tail -60 || true
          echo "=== eventlog (semantic transitions) ==="; tail -30 "$HOME/.local/state/zdev/events.ndjson" 2>/dev/null || true
          echo "=== daemon stdout ==="; cat /tmp/zdevd.log 2>/dev/null || true
          echo "=== list --json ==="; zdev-show list --json || true
