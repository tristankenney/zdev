# Full-history secret scan (adversarial review 2026-08-17, disclosure
# controls). Layer 1 of the layered controls: gitleaks' stock ruleset over
# the entire history — credentials, keys, tokens. The employer-identifier
# scan (layer 2) is deliberately NOT here: naming the identifiers in a
# public workflow would repeat the disclosure it exists to prevent; it
# waits on a decision about where the private denylist lives. Runs on
# push and weekly so it never depends on fork-PR secret availability, and
# on pull_request so a secret lands in review BEFORE it lands on main —
# the repo is about to gain PR-opening teammates, and main-only scanning
# means the leak is already public by the time this job would see it.
name: secret-scan

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 3" # Wednesdays 06:00 UTC
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # full history — the scan's whole point
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
